
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Notas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>
        <h1>SISTEMA DE NOTAS</h1>

        <section>
            <h2>Calcular média do aluno</h2>

            <label for="nota1">Primeira nota:</label>
            <input type="number" id="nota1" placeholder="Digite a primeira nota">

            <br><br>

            <label for="nota2">Segunda nota:</label>
            <input type="number" id="nota2" placeholder="Digite a segunda nota">

            <br><br>

            <label for="nota3">Terceira nota:</label>
            <input type="number" id="nota3" placeholder="Digite a terceira nota">

            <br><br>

            <button type="button" id="calcular">Calcular média</button>

            <p id="resultado">O resultado aparecerá aqui.</p>

            <p id="finalizacao"></p>
        </section>
    </main>

    <script src="script.js"></script>

</body>
</html>
